# Раз в сутки считает установки и обновления по воздуху по счётчикам
# скачиваний релизов и кладёт историю, графики и бейдж в ветку stats.
name: Статистика установок

on:
  schedule:
    - cron: "23 4 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-stats

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Открыть ветку stats
        run: |
          # Код 2 — ветки нет; любая другая ошибка останавливает запуск.
          code=0
          git ls-remote --exit-code --heads origin stats >/dev/null || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          if [ "$code" -eq 0 ]; then
            git fetch --depth=1 origin stats
            git worktree add --detach stats FETCH_HEAD
          else
            git worktree add --detach stats HEAD
            git -C stats checkout --orphan stats-new
            git -C stats rm -rfq .
          fi

      - name: Посчитать и нарисовать
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/downloads.py stats

      - name: Сохранить
        working-directory: stats
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898273+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Статистика за $(date -u +%F)"
          git push -q origin HEAD:refs/heads/stats
